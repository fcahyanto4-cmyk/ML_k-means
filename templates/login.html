<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk Sistem</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-dark: #111827;
            --text-muted: #6b7280;
            --border-radius: 20px;
            --transition: all 0.3s ease;
        }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #eef2ff, #f8fafc);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .background-circle {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            z-index: 0;
        }

        .circle-1 {
            width: 300px;
            height: 300px;
            background: #6366f1;
            top: -80px;
            left: -80px;
        }

        .circle-2 {
            width: 250px;
            height: 250px;
            background: #8b5cf6;
            bottom: -60px;
            right: -60px;
        }

        .login-container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 430px;
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(12px);
            border-radius: var(--border-radius);
            padding: 40px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.08);
            animation: fadeIn 0.7s ease;
        }

        .logo-box {
            width: 80px;
            height: 80px;
            margin: auto;
            margin-bottom: 20px;
            border-radius: 20px;
            background: linear-gradient(135deg, var(--primary-color), var(--primary-hover));
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 36px;
            box-shadow: 0 10px 25px rgba(79,70,229,0.3);
        }

        .login-title {
            text-align: center;
            font-size: 30px;
            font-weight: 800;
            margin-bottom: 8px;
            color: var(--text-dark);
        }

        .login-subtitle {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 35px;
            font-size: 15px;
        }

        .form-label {
            font-weight: 600;
            color: var(--text-dark);
        }

        .form-control {
            border-radius: 12px;
            padding: 12px 15px;
            border: 1px solid #d1d5db;
            transition: var(--transition);
        }

        .form-control:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 0.15rem rgba(79,70,229,0.2);
        }

        .btn-login {
            width: 100%;
            border: none;
            padding: 14px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--primary-color), var(--primary-hover));
            color: white;
            font-weight: 700;
            font-size: 16px;
            transition: var(--transition);
            margin-top: 10px;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(79,70,229,0.25);
        }

        .footer-text {
            margin-top: 25px;
            text-align: center;
            font-size: 13px;
            color: var(--text-muted);
        }

        .alert {
            border-radius: 12px;
            font-size: 14px;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(25px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

    </style>
</head>

<body>

    <div class="background-circle circle-1"></div>
    <div class="background-circle circle-2"></div>

    <div class="login-container">

        <div class="logo-box">
            <i class="bi bi-shield-lock-fill"></i>
        </div>

        <h1 class="login-title">Masuk Sistem</h1>
        <p class="login-subtitle">
            Sistem Analisis Pembayaran Pajak Perusahaan
        </p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form action="{{ url_for('login') }}" method="POST">

            <div class="mb-3">
                <label for="username" class="form-label">
                    Nama Pengguna
                </label>

                <input type="text"
                       class="form-control"
                       id="username"
                       name="username"
                       placeholder="Masukkan nama pengguna"
                       required>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">
                    Kata Sandi
                </label>

                <input type="password"
                       class="form-control"
                       id="password"
                       name="password"
                       placeholder="Masukkan kata sandi"
                       required>
            </div>

            <button type="submit" class="btn-login">
                <i class="bi bi-box-arrow-in-right"></i>
                Masuk
            </button>

        </form>

        <div class="footer-text">
            © 2026 Sistem Analisis Pajak
        </div>

    </div>

</body>
</html>
